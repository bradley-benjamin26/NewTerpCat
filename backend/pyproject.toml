[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "spacy>=3.8.16",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
